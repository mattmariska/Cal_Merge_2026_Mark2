name: Merge Calendars and Publish to GitHub Pages

# ---------------------------------------------------------------------------
# WHEN THIS RUNS
# ---------------------------------------------------------------------------
on:
  schedule:
    # Runs once an hour, on the hour. GitHub's cron scheduler runs in UTC,
    # and busy periods can delay a run by a few minutes — that's normal.
    - cron: "0 * * * *"
  # Lets you manually trigger a run from the "Actions" tab, useful for testing.
  workflow_dispatch:
  # Also republish whenever this workflow file or the script itself changes.
  push:
    branches: [main]

# Permissions GitHub Pages deployment needs. Without these, the deploy step
# will fail with a permissions error.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents two runs from trying to deploy to Pages at the same time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Check out this repo so the job can see merge_calendars.py
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install the packages the script needs
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the script — downloads, cleans, and merges the calendars into
      #    output/merged.ics
      - name: Merge calendars
        run: python merge_calendars.py

      # 5. Prepare the "output" folder to be published as a static site.
      #    GitHub Pages requires this specific setup step.
      - name: Set up Pages
        uses: actions/configure-pages@v5

      # 6. Package the "output" folder (which contains merged.ics) as the
      #    thing that will be published.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

      # 7. Actually publish it to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
